<!DOCTYPE html>
  <html lang="ko">
  <head>
      <meta charset="UTF-8">
        <title>100$ flex</title>
        <style>
        .wrap {
        display: flex;  
        flex-direction: column;
        min-height: 100vh;
        padding: 10px;
        border-bottom: 2px solid #fa5252;
        }

        .i {
        background-color: #ffc9c9;
        padding: 20px;
        text-align: center;
        border-bottom: 2px solid #fa5252;
        }

        .container{
        display: flex;
        flex: 1;
        gap: 10px;
        }
          
        .item {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        border: 1px solid #339af0;
        }

        .item.middle {
        flex: 3;
        background-color: mintcream;
        }

        .footer {
        display: flex;
        flex-direction: column;
        text-align: center;
        padding: 20px;  
        border-top: 1px solid #339af0;
        }
      
      </style>
      <body>
        <div class="wrap">
        <header class="i">제일 위의 박스</header>
        
        <main class="container">
        <div class="item">좌측 박스</div>
        <div class="item middle">2번 박스</div>
        <div class="item">우측 박스</div>
        </main>

        <footer class="footer">제일 아래의 박스</footer>
        </body>
</html>
