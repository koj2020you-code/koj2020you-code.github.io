<!DOCTYPE html>
  <html lang="ko">
  <head>
      <meta charset="UTF-8">
        <title>100$ flex</title>
        <style>
        .wrap {
        display: flex;  
        flex-direction: column;
        min-height: 100vh;
        padding: 10px;
        box-sizing: border-box;
        }

        .i {
        background-color: #ffc9c9;
        padding: 20px;
        text-align: center;
        border: 3px solid #339af0;
        margin-bottom: 10px;
        }

        .container{
        display: flex;
        flex: 1;
        gap: 10px;
        }
          
        .item {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        border: 1px solid #339af0;
        }

        .item.middle {
        flex: 3;
        background-color: mintcream;
        }

        .footer {
        display: flex;
        flex-direction: column;
        text-align: center;
        padding: 20px;  
        border: 3px solid #339af0;
        background-color: #e9ecef; 
        margin-top: 10px;
        }
      
      </style>
      <body>
        <div class="container">
        <header class="box">제일 위의 박스</header>
        
        <div class="middle-group">
        <aside class="box side">좌측 박스</aside>
        <main class="box center">2번 박스</main>
        <aside class="box side">우측 박스</aside>
        </div>

        <footer class="box">제일 아래의 박스</footer>
        </div>
        </body>
</html>
