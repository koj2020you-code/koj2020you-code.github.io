<form>
    <select name="country">
        <option value="kr">대한민국</option>
        <option value="us">미국</option>
        <option value="br">브라질</option>
        <option value="sar">사우디아라비아</option>
        <button type="submit">확인</button> 
    </select>
</form>
<body>
  <form method="GET">
  <fieldset style="display: inline-block;">
    <legend>추가 정보 입력</legend>
    
    <p>
      🎨 색상: 
      <input type="color" name="theme_color">
    </p>

    <p>
      📅 생년월일: 
      <input type="date" name="birth_day">
    </p>

    <button type="submit">데이터 전송 확인</button>
  </fieldset>
</form>

<form>  
   <div>
    <!— 0에서 100 사이의 숫자를 10 단위로 입력 —>
    <input type="number" name="experience" min="0" max="100" step"10" value="50"> 경력
   </div>

   <div>
    <!— 0에서 10 사이의 범위를 슬라이더로 조절 —>
    <input type="range" min="0" max="10" step="1"> 요소
   </div>
</form>

<form>
  <fieldset style="display: inline-block;">
    <input type="text" name="uid">
    <input type="password" name="pwd">
    <legend>주문 받을 과일은?</legend>
    <input type="checkbox" name="fruits" name="apple"> 사과
    <input type="checkbox" name="fruits" name="grape"> 포도 
    <input type="checkbox" name="fruits" name="orange"> 오렌지
    <button type="submit">확인</button> 
  </fieldset> 
</form> 

<form>
   <fieldset style="display: inline-block;">
    <input type="text" name="username">
    <input type="password" name="password">
    <legend>당신의 성별은?</legend>
    <input type="checkbox" name="agree"> 동의
    <input type="radio" name="gender" value="m"> 남성
    <input type="radio" name="gender" value="f"> 여성
    <input type="file" name="resume">
 </fieldset>
</form>
    
    <div id ="form_container">

     <input type=”password” name=”pwd” id=”pwd”>
   </div>
   <div class="btn_div">
    <button type=”submit”>로그인</button>
    </div>
   </form>
