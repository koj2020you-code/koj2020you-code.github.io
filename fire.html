<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자고싶어</title>
    <!-- You can link CSS files here -->
    <link rel="stylesheet" href="styles.css">
</head>
   <form> 
    <label for=”name”> Hi:</label>
    <input type=”text” id=”name” name=”name”>
    <textarea rows=”4” cols”30” name="text"></textarea>
    <button type=”submit”>제출</button>
   </form> 
<body>
  <style>
  table {
    border-collapse: collapse; /* 테두리를 한 줄로 합침 */
    width: 250px;              /* 표 너비 */
    text-align: center;        /* [정렬] 글자를 가운데로! */
  }

  th, td {
    border: 1px solid black;   /* 테두리 선 그리기 */
    padding: 10px;             /* 칸 안에 여유 공간 주기 */
  }

  th {
    background-color: orange;  /* [색구분] 제목은 오렌지색 */
  }

  td {
    background-color: white;   /* [색구분] 내용은 흰색 */
  }
</style>
    
    <table> 
    <tr><th>이름</th><th>나이</th></tr>
    <tr><td>최선호</td><td>25</td></tr>
  </table>
    <div>Hello</div>
    <span>ABC</span> <span>ABC</span>
    <span>ABC</span>
    <span>ABC</span>
    CDE
    CDE
</body>
</html>
